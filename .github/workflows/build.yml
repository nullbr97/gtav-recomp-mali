name: Build Android APK (Mali Patch)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld llvm libvulkan-dev jq curl zip unzip

      - name: Download Official Linux Package
        run: |
          mkdir -p upstream_pkg
          cd upstream_pkg
          
          # Descarrega o pacote oficial de Linux mais recente
          RELEASE_JSON=$(curl -s -H "User-Agent: GitHub-Actions" https://api.github.com/repos/andrewnakas/gtav-recomp/releases/latest)
          PKG_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | contains("linux")) | .browser_download_url' | head -n 1)
          
          if [ -n "$PKG_URL" ] && [ "$PKG_URL" != "null" ]; then
            echo "A descarregar pacote base: $PKG_URL"
            curl -H "User-Agent: GitHub-Actions" -L -o linux_pkg.tar.gz "$PKG_URL"
            tar -xzf linux_pkg.tar.gz || true
          fi
          cd ..

      - name: Apply Mali VRAM & Texture Fallback Patches
        run: |
          # 1. Reduz o buffer estatico de emulacao de 512MB para 128MB
          find gtav/src -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec sed -i 's/512 \* 1024 \* 1024/128 \* 1024 \* 1024/g' {} +

          # 2. Reduz orcamento de cache de texturas de 384MB para 128MB
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/budget 384/budget 128/g' {} +

          # 3. Altera fallback DXT de RGBA16 (format 97) para RGBA8 basico (format 37)
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/fallback format (using the Vulkan format 97/fallback format (using the Vulkan format 37/g' {} +
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/VK_FORMAT_R16G16B16A16_SFLOAT/VK_FORMAT_R8G8B8A8_UNORM/g' {} +

      - name: Assemble Android APK Shell
        run: |
          mkdir -p output_dist

          # Procura o APK que vem embutido nos pacotes oficiais ou nas ferramentas
          APK_FOUND=$(find upstream_pkg -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            echo "Encontrado APK base: $APK_FOUND"
            cp "$APK_FOUND" output_dist/GTAV_Mali.apk
          fi

          # Se o pacote trouxer o projeto Gradle pronto em tools/android
          PROJECT_DIR=$(find . -maxdepth 5 -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            echo "A compilar via Gradle em: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew || true
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug || ./gradlew assembleRelease || true
            fi
            cd -
            find "$PROJECT_DIR/build/outputs/apk" -name "*.apk" -exec cp {} output_dist/GTAV_Mali.apk \; || true
          fi

          # Recolhe qualquer outro ficheiro de dados do Android gerado
          find upstream_pkg -name "*android*" -type f -exec cp {} output_dist/ \; || true

          # Listagem dos ficheiros prontos
          ls -lh output_dist/

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: GTAV-Mali-Build
          path: output_dist/*.apk
          if-no-files-found: error
