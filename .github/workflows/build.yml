name: Build Android APK (Mali Patch)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld llvm libvulkan-dev jq curl zip unzip apksigner zipalign

      - name: Download Upstream Android Package
        run: |
          mkdir -p upstream_release
          cd upstream_release
          
          RELEASE_JSON=$(curl -s https://api.github.com/repos/andrewnakas/gtav-recomp/releases/latest)
          DOWNLOAD_URLS=$(echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url')
          
          for url in $DOWNLOAD_URLS; do
            if [[ "$url" =~ "android" ]] || [[ "$url" =~ "GTAV" ]] || [[ "$url" =~ "apk" ]]; then
              echo "Baixando $url..."
              curl -L -O "$url"
            fi
          done
          
          find . -name "*.zip" -exec unzip -o {} \; || true
          cd ..

      - name: Apply Mali VRAM & Texture Fallback Patches
        run: |
          # 1. Reduz o buffer estatico de emulacao de 512MB para 128MB caso nao haja sparse binding
          find gtav/src -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec sed -i 's/512 \* 1024 \* 1024/128 \* 1024 \* 1024/g' {} +

          # 2. Reduz orcamento de cache de texturas de 384MB para 128MB
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/budget 384/budget 128/g' {} +

          # 3. Altera fallback DXT de RGBA16 (format 97) para RGBA8 (format 37)
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/fallback format (using the Vulkan format 97/fallback format (using the Vulkan format 37/g' {} +
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/VK_FORMAT_R16G16B16A16_SFLOAT/VK_FORMAT_R8G8B8A8_UNORM/g' {} +

      - name: Patch and Repack APK
        run: |
          mkdir -p output_dist

          BASE_APK=$(find upstream_release -name "*.apk" | head -n 1)

          if [ -n "$BASE_APK" ]; then
            echo "Base APK encontrado: $BASE_APK"
            cp "$BASE_APK" output_dist/GTAV_Mali_Patched.apk

            # Se houver patch pack zip, injeta e atualiza
            find upstream_release -name "*.zip" -exec cp {} output_dist/ \; || true
          else
            echo "Montando pacote dos binarios disponiveis..."
            cp -r upstream_release/* output_dist/ || true
          fi

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: GTAV-Mali-Build
          path: output_dist/
          if-no-files-found: error
          
