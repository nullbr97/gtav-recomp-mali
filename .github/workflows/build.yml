name: Build Android APK (Mali Patch)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld llvm libvulkan-dev

      - name: Apply Mali VRAM & Texture Fallback Patches
        run: |
          # 1. Reduz o buffer estatico de emulacao de 512MB para 128MB caso nao haja sparse binding
          find gtav/src -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec sed -i 's/512 \* 1024 \* 1024/128 \* 1024 \* 1024/g' {} +

          # 2. Reduz orcamento de cache de texturas padrao de 384MB para 128MB
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/budget 384/budget 128/g' {} +

          # 3. Altera o fallback de descompressao DXT de RGBA16 (format 97) para RGBA8 basico (format 37) para cortar metade da VRAM
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/fallback format (using the Vulkan format 97/fallback format (using the Vulkan format 37/g' {} +
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/VK_FORMAT_R16G16B16A16_SFLOAT/VK_FORMAT_R8G8B8A8_UNORM/g' {} +

      - name: Build Android Shell & Game
        run: |
          chmod +x tools/android/make_shell.sh || true
          chmod +x build.sh || true
          
          # Se o script make_shell existir, compila o shell do app
          if [ -f "tools/android/make_shell.sh" ]; then
            bash tools/android/make_shell.sh
          fi

          # Compila o APK usando o Gradle wrapper
          if [ -d "tools/android/shell" ]; then
            cd tools/android/shell
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
            cd ../../../
          fi

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTAV-Mali-Build
          path: |
            **/*.apk
            android/*.zip
          if-no-files-found: warn
          
