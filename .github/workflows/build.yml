name: Build Android APK (Mali Patch)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld llvm libvulkan-dev

      - name: Apply Mali VRAM & Texture Fallback Patches
        run: |
          # 1. Reduz o buffer estático de emulação de 512MB para 128MB caso não haja sparse binding
          find gtav/src -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec sed -i 's/512 \* 1024 \* 1024/128 \* 1024 \* 1024/g' {} +

          # 2. Reduz orçamento de cache de texturas de 384MB para 128MB
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/budget 384/budget 128/g' {} +

          # 3. Altera o fallback DXT de RGBA16 (format 97) para RGBA8 (format 37)
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/fallback format (using the Vulkan format 97/fallback format (using the Vulkan format 37/g' {} +
          find gtav/src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/VK_FORMAT_R16G16B16A16_SFLOAT/VK_FORMAT_R8G8B8A8_UNORM/g' {} +

      - name: Build Android Shell & Game
        run: |
          mkdir -p build_output
          chmod +x tools/android/*.sh || true

          # Executa o make_shell passando os diretórios esperados como parâmetros ($1 e $2)
          bash tools/android/make_shell.sh build_output release || \
          bash tools/android/make_shell.sh build_output || \
          bash tools/android/make_shell.sh .

          # Compila o APK via Gradle no diretório do projeto Android
          SHELL_DIR=$(find . -maxdepth 4 -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$SHELL_DIR" ]; then
            cd "$SHELL_DIR"
            chmod +x gradlew || true
            if [ -f "./gradlew" ]; then
              ./gradlew assembleRelease || ./gradlew assembleDebug
            else
              gradle assembleRelease || gradle assembleDebug
            fi
            cd -
          fi

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTAV-Mali-Build
          path: |
            **/*.apk
            **/*.zip
          if-no-files-found: warn
          
